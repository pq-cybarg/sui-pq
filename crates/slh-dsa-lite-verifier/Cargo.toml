[package]
name = "slh-dsa-lite-verifier"
version = "0.0.1"
edition = "2021"
publish = false
description = "SLH-DSA-LITE (n=32) verify-only implementation for a native Sui PQ signature scheme. WIP port of packages/pqc/src/slh-dsa-ref.ts."

# Standalone so it can be developed + KAT-tested fast, then dropped into the
# Sui validator patch (a new SignatureScheme::SlhDsaLite dispatch).
[dependencies]
sha2 = "0.10"

[dev-dependencies]
hex = "0.4"
